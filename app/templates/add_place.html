{% extends "base.html" %}
{% block title %}Add Place{% endblock %}
{% block content %}
<h1>Add a new place</h1>
<form class="stack-form" action="/places/add" method="post">
  <input type="text" name="place_name" placeholder="Place name" required>
  <input type="text" name="location" placeholder="Location" required>
  <input type="text" name="category" placeholder="Category" required>
  <textarea name="description" placeholder="Description" required></textarea>
  <input type="number" name="entry_fee" step="0.01" min="0" placeholder="Entry fee" required>
  <input type="text" name="visiting_hours" placeholder="Visiting hours" required>
  <input type="text" name="district" placeholder="District">
  <input type="number" step="0.0001" name="latitude" placeholder="Latitude">
  <input type="number" step="0.0001" name="longitude" placeholder="Longitude">
  <input type="url" name="image_url" placeholder="Image URL">
  <input type="text" name="best_season" placeholder="Best season">
  <input type="number" step="0.1" min="1" max="5" name="eco_rating" placeholder="Eco rating (1-5)">
  <button type="submit">Submit for review</button>
</form>
{% endblock %}
